# Docker Compose for Development
services:
  crm-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nationrise-crm-dev
    env_file:
      - .env.development
    ports:
      - "${PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    restart: unless-stopped
