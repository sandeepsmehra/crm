# Docker Compose for Production
services:
  crm-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nationrise-crm-prod
    env_file:
      - .env.production
    ports:
      - "${PORT:-80}:80"
    environment:
      - NODE_ENV=production
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
